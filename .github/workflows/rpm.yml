name: Build RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install checkout dependency
        run: dnf -y install git

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install \
            git \
            rpm-build \
            python3-build \
            python3-devel \
            pyproject-rpm-macros

      - name: Build source, wheel, and RPM artifacts
        run: scripts/build-rpm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myprison-rpm-${{ github.ref_name }}
          path: |
            dist/*
            build/rpm/RPMS/**/*.rpm
            build/rpm/SRPMS/*.rpm
