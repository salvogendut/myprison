[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myprison"
version = "0.4.0"
description = "Curses-based static blog manager producing Hugo-compatible sites"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
myprison = "myprison.__main__:main"
myprison-textual = "myprison.textual_main:main"

[project.optional-dependencies]
textual = ["textual>=0.85"]

[tool.setuptools]
packages = ["myprison", "myprison.ai_providers"]
